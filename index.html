<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ゆうやけ商店街</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js" onerror="var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';document.head.appendChild(s)"></script>
<style>
:root{
  --bg:#fff3e3;--bg2:#ffe2c4;--ink:#3a2a1e;--sub:#8a6b55;--line:#e8c9a8;--panel:#fffaf3;
  --blue:#3b7fc4;--green:#3a9a5b;--red:#d4473f;--purple:#8a5bc4;--gold:#d99a12;--accent:#e8663a;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:linear-gradient(180deg,#ffd9b3 0,var(--bg) 220px) fixed;color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;min-height:100vh}
button{font:inherit;cursor:pointer}
.wrap{max-width:1100px;margin:0 auto;padding:12px 16px 40px}
h1{margin:6px 0 2px;font-size:28px;letter-spacing:.05em}
.sub{color:var(--sub);font-size:13px}
.box{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:700;box-shadow:0 3px 0 #b84a24}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #b84a24}
.btn.gray{background:#a08a78;box-shadow:0 3px 0 #75604f}
.btn.blue{background:var(--blue);box-shadow:0 3px 0 #285a8c}
.btn:disabled{opacity:.45;cursor:default}
.btn.big{font-size:20px;padding:14px 22px}
input{font:inherit;padding:9px 12px;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.status{color:var(--red);font-weight:700;min-height:1.2em}
/* players */
.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.pl{background:var(--panel);border:3px solid var(--line);border-radius:14px;padding:10px;position:relative;transition:border-color .2s}
.pl.now{border-color:var(--accent);box-shadow:0 0 0 4px #ffb08a55}
.pl.me .pn::after{content:"あなた";font-size:11px;background:var(--accent);color:#fff;border-radius:6px;padding:1px 6px;margin-left:6px}
.pn{font-weight:700;display:flex;align-items:center}
.pc{font-size:22px;margin:2px 0;position:relative}
.pc b{font-size:26px}
.plm{font-size:20px;letter-spacing:2px}
.plm .off{filter:grayscale(1);opacity:.25}
.plm small{font-size:12px;color:var(--sub);letter-spacing:0;margin-left:4px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chip{font-size:12px;border-radius:7px;padding:2px 6px;color:#fff;white-space:nowrap}
.chip.blue{background:var(--blue)}.chip.green{background:var(--green)}.chip.red{background:var(--red)}.chip.purple{background:var(--purple)}
.chip.hit{outline:3px solid #ffd000;animation:pop .5s}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.35)}100%{transform:scale(1)}}
.float{position:absolute;left:70px;top:-4px;font-weight:900;font-size:22px;animation:up 1.4s forwards;pointer-events:none}
.float.plus{color:var(--green)}.float.minus{color:var(--red)}
@keyframes up{0%{opacity:0;transform:translateY(8px)}15%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
.turnmark{position:absolute;right:10px;top:8px;font-size:12px;background:var(--accent);color:#fff;border-radius:8px;padding:2px 8px}
/* center */
.center{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:720px){.center{grid-template-columns:1fr}}
.dice{display:flex;gap:10px;align-items:center;min-height:70px}
.die{width:62px;height:62px;border-radius:14px;background:#fff;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900}
.total{font-size:30px;font-weight:900;margin-left:8px}
.prompt{font-size:17px;font-weight:700;margin:8px 0}
.log{font-size:13px;line-height:1.6;max-height:200px;overflow:auto}
.log div:first-child{font-weight:700}
.log div{border-bottom:1px dashed var(--line);padding:2px 0}
/* market */
h3{margin:4px 0 8px;font-size:16px}
.mk{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:8px}
.card{background:#fff;border:3px solid;border-radius:12px;padding:0;text-align:left;color:var(--ink);overflow:hidden;display:flex;flex-direction:column;min-height:150px}
.card.blue{border-color:var(--blue)}.card.green{border-color:var(--green)}.card.red{border-color:var(--red)}.card.purple{border-color:var(--purple)}.card.lm{border-color:var(--gold)}
.ch{display:flex;justify-content:space-between;align-items:center;color:#fff;padding:3px 7px;font-weight:900}
.blue .ch{background:var(--blue)}.green .ch{background:var(--green)}.red .ch{background:var(--red)}.purple .ch{background:var(--purple)}.lm .ch{background:var(--gold)}
.ch .num{font-size:18px}
.ci{font-size:34px;text-align:center;line-height:1.2;margin-top:4px}
.cn{font-weight:900;text-align:center;font-size:14px}
.ce{font-size:11.5px;padding:3px 7px;line-height:1.35;flex:1}
.cs{font-size:11px;color:var(--sub);padding:0 7px 5px;text-align:right}
.card.can{box-shadow:0 0 0 3px #ffd000;animation:glow 1.2s infinite alternate}
@keyframes glow{to{box-shadow:0 0 0 3px #ffd00055}}
.card:disabled{opacity:.5;cursor:default}
.card.done{opacity:1;background:#fff6d6}
.legend{font-size:12px;color:var(--sub);margin-bottom:6px}
.legend span{display:inline-block;margin-right:10px}
/* banner */
#banner{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.6);background:#fff;border:4px solid var(--accent);border-radius:20px;padding:18px 26px;font-size:24px;font-weight:900;text-align:center;opacity:0;pointer-events:none;transition:all .25s;z-index:10;max-width:92vw;box-shadow:0 10px 40px #0003}
#banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.code{font-size:44px;font-weight:900;letter-spacing:.2em;color:var(--accent)}
.plist div{padding:6px 0;border-bottom:1px dashed var(--line);display:flex;justify-content:space-between;align-items:center}
details summary{cursor:pointer;font-weight:700}
.rules{font-size:14px;line-height:1.8}
.win{font-size:30px;font-weight:900;text-align:center}
.small{font-size:12px;color:var(--sub)}
.choice{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.choice .btn{padding:7px 10px;font-size:14px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="banner"></div>
<script>
/* ===================== カードの中身 ===================== */
// c: blue=だれの番でも / green=自分の番 / red=人の番(振った人からもらう) / purple=自分の番・特別
const CARDS=[
 {k:'tanbo',n:'田んぼ',i:'🌾',c:'blue',r:[1],cost:1,g:1,tag:'field'},
 {k:'bokujo',n:'牧場',i:'🐄',c:'blue',r:[2],cost:1,g:1,tag:'field',plus:1},
 {k:'chikurin',n:'竹林',i:'🎋',c:'blue',r:[4],cost:2,g:1,tag:'wood'},
 {k:'gyoko',n:'漁港',i:'⚓',c:'blue',r:[6],cost:2,g:1,tag:'sea'},
 {k:'mikan',n:'みかん畑',i:'🍊',c:'blue',r:[8],cost:3,g:2,tag:'fruit'},
 {k:'cha',n:'茶畑',i:'🍵',c:'blue',r:[9],cost:3,g:2,tag:'field',plus:1},
 {k:'fusha',n:'風力発電',i:'🌀',c:'blue',r:[11],cost:5,g:4},
 {k:'onsen',n:'温泉',i:'♨️',c:'blue',r:[12],cost:4,g:3,plus:1},

 {k:'dagashi',n:'駄菓子屋',i:'🍬',c:'green',r:[2,3],cost:1,g:1},
 {k:'pan',n:'パン工房',i:'🥐',c:'green',r:[3],cost:2,g:2,plus:1},
 {k:'konbini',n:'コンビニ',i:'🏪',c:'green',r:[4],cost:2,g:2},
 {k:'honya',n:'本屋',i:'📚',c:'green',r:[5],cost:3,g:3},
 {k:'tofu',n:'豆腐工場',i:'🏭',c:'green',r:[7],cost:4,g:2,per:'field'},
 {k:'kagu',n:'家具工房',i:'🪑',c:'green',r:[9],cost:3,g:2,per:'wood'},
 {k:'sakana',n:'魚屋',i:'🐟',c:'green',r:[10],cost:2,g:3,per:'sea'},
 {k:'jam',n:'ジャム工場',i:'🍯',c:'green',r:[11,12],cost:3,g:2,per:'fruit',plus:1},

 {k:'kissa',n:'喫茶店',i:'☕',c:'red',r:[1],cost:1,take:1,plus:1},
 {k:'ramen',n:'ラーメン屋台',i:'🍜',c:'red',r:[3],cost:2,take:1},
 {k:'yakitori',n:'焼き鳥屋',i:'🍢',c:'red',r:[7],cost:4,take:2},
 {k:'izakaya',n:'居酒屋',i:'🍶',c:'red',r:[8,9],cost:3,take:2,plus:1},
 {k:'sushi',n:'回転寿司',i:'🍣',c:'red',r:[10],cost:3,take:3},

 {k:'kuji',n:'宝くじ売り場',i:'🎫',c:'purple',r:[2],cost:3,sp:'kuji',plus:1},
 {k:'matsuri',n:'夏祭り会場',i:'🏮',c:'purple',r:[6],cost:6,sp:'matsuri'},
 {k:'jiage',n:'地上げ屋',i:'🏗️',c:'purple',r:[8],cost:7,sp:'swap'},
 {k:'radio',n:'ラジオ局',i:'📻',c:'purple',r:[11],cost:5,sp:'radio',plus:1},
 {k:'tantei',n:'探偵事務所',i:'🕵️',c:'purple',r:[12],cost:6,sp:'tantei'},
];
const LMS=[
 {k:'koban',n:'交番',i:'🚓',cost:4,d:'赤のお店に取られるコインが、お店1枚につき1枚少なくなる'},
 {k:'library',n:'図書館',i:'🏛️',cost:5,d:'お店を買うとき1コイン安い(最低1)',plus:1},
 {k:'arcade',n:'アーケード',i:'🛍️',cost:6,d:'自分の緑と赤のお店で入るコインが、1枚につき+1'},
 {k:'jinja',n:'神社',i:'⛩️',cost:8,d:'1回の番に1度、サイコロを振り直せる'},
 {k:'post',n:'郵便局',i:'🏤',cost:9,d:'自分の番のはじめに1コインもらう',plus:1},
 {k:'rotary',n:'駅前ロータリー',i:'🚉',cost:10,d:'サイコロ2個のとき、合計を1増やすか1減らせる'},
 {k:'tower',n:'テレビ塔',i:'🗼',cost:12,d:'ゾロ目が出たら、もう1回自分の番'},
 {k:'stadium',n:'野球場',i:'⚾',cost:13,d:'だれかがゾロ目を出すたびに2コインもらう',plus:1},
 {k:'super',n:'大型スーパー',i:'🏬',cost:14,d:'自分の番に、青のお店で入るコインが2倍'},
];
const TAGS={field:'🌾畑・牧場',wood:'🎋竹林',sea:'⚓漁港',fruit:'🍊みかん畑'};
const MODES={normal:{name:'ノーマル',need:4},plus:{name:'プラス',need:5}};
const COLOR_NAME={blue:'🔵 だれの番でも',green:'🟢 自分の番だけ',red:'🔴 人の番だけ(振った人からもらう)',purple:'🟣 自分の番だけ・特別(1人1枚まで)'};
const SP_TEXT={matsuri:'ほかの全員から2枚ずつもらう',tantei:'いちばんお金持ちの人から半分もらう(最大8)',kuji:'サイコロ1個を振る。5か6なら+8、ほかは+1',swap:'だれかのお店1枚と、自分のお店1枚を取りかえる',radio:'好きな人から4枚もらう'};
const CMAP=Object.fromEntries(CARDS.map(c=>[c.k,c])), LMAP=Object.fromEntries(LMS.map(l=>[l.k,l]));
const cardsFor=m=>CARDS.filter(c=>m==='plus'||!c.plus);
const lmsFor=m=>LMS.filter(l=>m==='plus'||!l.plus);
const CPU_NAMES=['タヌキ店長','ネコ社長','カエル会長','キツネ番頭','フクロウ先生'];

/* ===================== 便利関数 ===================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const uid=()=>Math.random().toString(36).slice(2,10);
const rnd6=()=>1+Math.floor(Math.random()*6);
const rs=c=>c.r.length>1?`${c.r[0]}〜${c.r[c.r.length-1]}`:`${c.r[0]}`;
const sum=a=>a.reduce((x,y)=>x+y,0);
function effText(c){
  if(c.c==='blue')return `だれの番でも +${c.g}`;
  if(c.c==='green')return c.per?`自分の${TAGS[c.per]}1枚につき +${c.g}`:`自分の番 +${c.g}`;
  if(c.c==='red')return `振った人から ${c.take}枚もらう`;
  return SP_TEXT[c.sp];
}
function lsGet(k,d){try{return localStorage.getItem(k)??d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* ===================== 状態 ===================== */
let S=null;                 // ゲームの状態(部屋主が正本を持つ)
const me={pid:null,name:lsGet('yy_name',''),cid:lsGet('yy_cid','')||uid()};
lsSet('yy_cid',me.cid);
let isHost=false,peer=null,hostConn=null,statusMsg='';
const conns=new Map();      // 部屋主側: conn -> {pid}
const ui={swapTake:null};

const P=id=>S.players.find(p=>p.id===id);
const cur=()=>S.players[S.turn];
const own=(p,k)=>p.cards[k]||0;
const tagCount=(p,t)=>CARDS.filter(c=>c.tag===t).reduce((a,c)=>a+own(p,c.k),0);
const hits=(c,t)=>c.r.includes(t);
const builtCount=p=>Object.keys(p.lm).filter(k=>p.lm[k]).length;
function pay(from,to,n){n=Math.max(0,Math.min(n,from.coins));from.coins-=n;to.coins+=n;return n}
function log(t){S.log.unshift(t);if(S.log.length>40)S.log.pop()}
function bn(t){S.bnId=(S.bnId||0)+1;S.bn.push({id:S.bnId,t});if(S.bn.length>6)S.bn.shift()}
function buyCost(p,c){return p.lm.library?Math.max(1,c.cost-1):c.cost}

/* ===================== ゲームの進行(部屋主だけが動かす) ===================== */
function newGame(){
  // 席順をシャッフル
  for(let i=S.players.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[S.players[i],S.players[j]]=[S.players[j],S.players[i]]}
  S.players.forEach(p=>{p.coins=3;p.cards={tanbo:1,dagashi:1};p.lm={}});
  S.bank={};cardsFor(S.mode).forEach(c=>S.bank[c.k]=c.c==='purple'?4:6);
  S.gid=uid();S.turn=0;S.log=[];S.bn=[];S.bnId=0;S.winner=null;S.rollSeq=0;S.round=1;
  log(`ゲームスタート！ 名所を${MODES[S.mode].need}つ建てた人の勝ち`);
  startTurn();
}
function startTurn(){
  const R=cur();
  S.phase='roll';S.dice=[];S.total=null;S.rerolled=false;S.adj=0;S.pending=[];S.hitT=null;S.hitR=null;
  if(R.lm.post){R.coins+=1;log(`🏤 ${R.name}の郵便局 +1`)}
}
function doRoll(n){S.nd=n;S.dice=Array.from({length:n},rnd6);S.rollSeq++;}
function afterRoll(){
  const R=cur();
  if(R.lm.jinja&&!S.rerolled){S.phase='reroll';return}
  postReroll();
}
function postReroll(){
  const R=cur();
  if(R.lm.rotary&&S.dice.length===2){S.phase='adjust';return}
  doResolve();
}
function doResolve(){
  S.total=Math.max(1,Math.min(12,sum(S.dice)+S.adj));
  S.hitT=S.total;S.hitR=cur().id;
  log(`🎲 ${cur().name}：${S.dice.join('+')}${S.adj?(S.adj>0?' +1':' -1'):''} ＝ ${S.total}`);
  resolve();
  S.phase=S.pending.length?'choose':'buy';
}
function resolve(){
  const R=cur(),t=S.total,n=S.players.length,ri=S.turn,cs=cardsFor(S.mode);
  let earned=0;
  // 1) 赤：振った人の前の人から逆回りに
  for(let s=1;s<n;s++){
    const p=S.players[(ri-s+n)%n];
    cs.filter(c=>c.c==='red'&&hits(c,t)).forEach(c=>{
      const k=own(p,c.k);if(!k)return;
      const per=c.take+(p.lm.arcade?1:0)-(R.lm.koban?1:0);
      if(per<=0){log(`🚓 ${R.name}の交番が${p.name}の${c.n}をふせいだ`);return}
      const got=pay(R,p,per*k);
      if(got>0)log(`${c.i} ${p.name}の${c.n}：${R.name}から ${got}枚`);
      else log(`${c.i} ${p.name}の${c.n}：${R.name}はコインが0枚だった`);
    });
  }
  // 2) 青：全員
  S.players.forEach(p=>cs.filter(c=>c.c==='blue'&&hits(c,t)).forEach(c=>{
    const k=own(p,c.k);if(!k)return;
    let g=c.g*k;if(p===R&&p.lm.super)g*=2;
    p.coins+=g;if(p===R)earned+=g;log(`${c.i} ${p.name}の${c.n} +${g}`);
  }));
  // 3) 緑：振った人
  cs.filter(c=>c.c==='green'&&hits(c,t)).forEach(c=>{
    const k=own(R,c.k);if(!k)return;
    const g=(c.per?c.g*tagCount(R,c.per):c.g)*k+(R.lm.arcade?k:0);
    if(g<=0){log(`${c.i} ${R.name}の${c.n}：材料がなくて0枚`);return}
    R.coins+=g;earned+=g;log(`${c.i} ${R.name}の${c.n} +${g}`);
  });
  // 4) 紫：振った人
  cs.filter(c=>c.c==='purple'&&hits(c,t)&&own(R,c.k)).forEach(c=>{
    if(c.sp==='matsuri'){let s2=0;S.players.forEach(p=>{if(p!==R)s2+=pay(p,R,2)});earned+=s2;log(`🏮 ${R.name}の夏祭り：みんなから合計${s2}枚`);bn(`🏮 夏祭り！<br>${esc(R.name)}がみんなから ${s2}枚`)}
    if(c.sp==='tantei'){const others=S.players.filter(p=>p!==R);const tg=others.reduce((a,b)=>b.coins>a.coins?b:a);const got=pay(tg,R,Math.min(8,Math.floor(tg.coins/2)));earned+=got;log(`🕵️ ${R.name}の探偵事務所：${tg.name}から${got}枚`);bn(`🕵️ 探偵が調べた！<br>${esc(tg.name)}から ${got}枚`)}
    if(c.sp==='kuji'){const d=rnd6(),g=d>=5?8:1;R.coins+=g;earned+=g;log(`🎫 ${R.name}の宝くじ：${d}が出て +${g}`);if(g===8)bn(`🎫 宝くじ大当たり！<br>${esc(R.name)} +8`)}
    if(c.sp==='swap')S.pending.push('swap');
    if(c.sp==='radio')S.pending.push('radio');
  });
  // 5) ゾロ目
  if(S.dice.length===2&&S.dice[0]===S.dice[1]){
    let s2=0;S.players.forEach(p=>{if(p!==R)s2+=pay(p,R,1)});earned+=s2;
    log(`🎉 ゾロ目！ ${R.name}がみんなから1枚ずつ(合計${s2}枚)`);
    bn(`🎉 ゾロ目！<br>みんなから1枚ずつ`);
    S.players.forEach(p=>{if(p.lm.stadium){p.coins+=2;if(p===R)earned+=2;log(`⚾ ${p.name}の野球場 +2`)}});
  }
  // 6) 残念賞
  if(earned===0&&!S.pending.length){R.coins+=1;log(`😢 ${R.name}は何も入らなかったので残念賞 +1`)}
}
function endTurn(){
  const R=cur();
  if(S.dice.length===2&&S.dice[0]===S.dice[1]&&R.lm.tower){log(`🗼 ${R.name}のテレビ塔：もう1回！`);bn(`🗼 もう1回 ${esc(R.name)}の番！`);startTurn();return}
  S.turn=(S.turn+1)%S.players.length;
  if(S.turn===0)S.round++;
  startTurn();
}
function swapOptions(R){
  const give=cardsFor(S.mode).filter(c=>c.c!=='purple'&&own(R,c.k));
  const take=[];S.players.forEach(p=>{if(p===R)return;cardsFor(S.mode).forEach(c=>{if(c.c!=='purple'&&own(p,c.k))take.push({pid:p.id,k:c.k})})});
  return {give,take};
}

function act(pid,a){
  if(!isHost||!S||!a)return;
  if(S.phase==='lobby'){
    if(pid!==S.hostId)return;
    if(a.t==='addcpu'&&S.players.length<4){const used=S.players.map(p=>p.name);S.players.push({id:uid(),name:CPU_NAMES.find(n=>!used.includes(n))||'CPU',cpu:true})}
    if(a.t==='rm'&&a.id!==S.hostId)S.players=S.players.filter(p=>p.id!==a.id);
    if(a.t==='mode'&&MODES[a.m])S.mode=a.m;
    if(a.t==='start'&&S.players.length>=2)newGame();
    return broadcast();
  }
  if(S.phase==='over'){
    if(pid===S.hostId&&a.t==='again'){S.players=S.players.filter(p=>!p.sub);S.phase='lobby';S.log=[];S.bn=[]}
    return broadcast();
  }
  const R=cur();if(pid!==R.id)return;
  let ok=true;
  switch(a.t){
    case 'roll': if(S.phase!=='roll'||![1,2].includes(a.n)){ok=false;break}
      doRoll(a.n);afterRoll();break;
    case 'reroll': if(S.phase!=='reroll'){ok=false;break}
      S.rerolled=true;
      if(a.yes){const old=sum(S.dice);doRoll(S.nd);log(`⛩️ ${R.name}が振り直し(${old}→${sum(S.dice)})`)}
      postReroll();break;
    case 'adjust': if(S.phase!=='adjust'||![-1,0,1].includes(a.d)){ok=false;break}
      S.adj=a.d;doResolve();break;
    case 'radio':{ if(S.phase!=='choose'||S.pending[0]!=='radio'){ok=false;break}
      const tg=P(a.pid);if(!tg||tg===R){ok=false;break}
      const got=pay(tg,R,4);log(`📻 ${R.name}のラジオ局：${tg.name}から${got}枚`);bn(`📻 ラジオ局！<br>${esc(tg.name)}から ${got}枚`);
      S.pending.shift();if(!S.pending.length)S.phase='buy';break}
    case 'swap':{ if(S.phase!=='choose'||S.pending[0]!=='swap'){ok=false;break}
      const tg=P(a.pid),tc=CMAP[a.take],gc=CMAP[a.give];
      if(!tg||tg===R||!tc||!gc||tc.c==='purple'||gc.c==='purple'||!own(tg,tc.k)||!own(R,gc.k)){ok=false;break}
      tg.cards[tc.k]--;R.cards[tc.k]=own(R,tc.k)+1;R.cards[gc.k]--;tg.cards[gc.k]=own(tg,gc.k)+1;
      log(`🏗️ ${R.name}の地上げ屋：${tg.name}の${tc.n}と自分の${gc.n}を取りかえた`);bn(`🏗️ 地上げ屋！<br>${esc(tg.name)}の${tc.i}${tc.n}をいただき`);
      S.pending.shift();if(!S.pending.length)S.phase='buy';break}
    case 'skip': if(S.phase!=='choose'){ok=false;break}
      S.pending.shift();if(!S.pending.length)S.phase='buy';break;
    case 'buy':{ if(S.phase!=='buy'){ok=false;break}
      const c=CMAP[a.k];if(!c||!cardsFor(S.mode).includes(c)||!(S.bank[c.k]>0)||(c.c==='purple'&&own(R,c.k))||R.coins<buyCost(R,c)){ok=false;break}
      R.coins-=buyCost(R,c);R.cards[c.k]=own(R,c.k)+1;S.bank[c.k]--;
      log(`🛒 ${R.name}が${c.i}${c.n}を買った`);endTurn();break}
    case 'build':{ if(S.phase!=='buy'){ok=false;break}
      const l=LMAP[a.k];if(!l||!lmsFor(S.mode).includes(l)||R.lm[l.k]||R.coins<l.cost){ok=false;break}
      R.coins-=l.cost;R.lm[l.k]=true;
      log(`🏗️ ${R.name}が名所「${l.i}${l.n}」を建てた！(${builtCount(R)}/${MODES[S.mode].need})`);
      if(builtCount(R)>=MODES[S.mode].need){S.winner=R.id;S.phase='over';log(`👑 ${R.name}の勝ち！`);bn(`👑 ${esc(R.name)}の勝ち！`)}
      else{bn(`${l.i} ${esc(R.name)}が${l.n}を建てた！<br><small>あと${MODES[S.mode].need-builtCount(R)}つ</small>`);endTurn()}
      break}
    case 'pass': if(S.phase!=='buy'){ok=false;break}
      log(`${R.name}は何も買わなかった`);endTurn();break;
    default: ok=false;
  }
  if(ok)broadcast();
}

/* ===================== コンピューター ===================== */
const D1={},D2={};for(let i=1;i<=6;i++){D1[i]=1/6;for(let j=1;j<=6;j++)D2[i+j]=(D2[i+j]||0)+1/36}
function estOwn(p,t){
  const n=S.players.length;let v=0;
  cardsFor(S.mode).forEach(c=>{const k=own(p,c.k);if(!k||!hits(c,t))return;
    if(c.c==='blue')v+=c.g*k*(p.lm.super?2:1);
    if(c.c==='green')v+=(c.per?c.g*tagCount(p,c.per):c.g)*k+(p.lm.arcade?k:0);
    if(c.c==='purple')v+={matsuri:2*(n-1),tantei:4,kuji:2.3,swap:2.5,radio:3.5}[c.sp];
  });
  S.players.forEach(o=>{if(o===p)return;cardsFor(S.mode).forEach(c=>{if(c.c==='red'&&hits(c,t)&&own(o,c.k))v-=Math.max(0,c.take+(o.lm.arcade?1:0)-(p.lm.koban?1:0))*own(o,c.k)})});
  return v;
}
const ev=(p,D)=>Object.keys(D).reduce((a,t)=>a+D[t]*estOwn(p,+t),0);
function cardValue(p,c){
  const n=S.players.length;
  const high=cardsFor(S.mode).some(x=>own(p,x.k)&&x.r[0]>=7&&x.c!=='red')||c.r[0]>=7;
  const D=high?D2:Object.fromEntries(Object.keys(D2).map(t=>[t,(D1[t]||0)*.5+D2[t]*.5]));
  const pr=sum(c.r.map(t=>D[t]||0));
  let v=0;
  if(c.c==='blue')v=pr*c.g*(1+(n-1)*.7);
  if(c.c==='green')v=pr*(c.per?c.g*Math.max(.5,tagCount(p,c.per)):c.g);
  if(c.c==='red')v=pr*c.take*(n-1)*.8;
  if(c.c==='purple')v=pr*{matsuri:2*(n-1),tantei:4,kuji:2.3,swap:2.5,radio:3.5}[c.sp];
  if(c.tag)cardsFor(S.mode).forEach(x=>{if(x.per===c.tag&&own(p,x.k))v+=sum(x.r.map(t=>D[t]||0))*x.g*own(p,x.k)});
  return v/buyCost(p,c);
}
function cpuDecide(R){
  switch(S.phase){
    case 'roll':return {t:'roll',n:ev(R,D2)>ev(R,D1)+.05?2:1};
    case 'reroll':return {t:'reroll',yes:estOwn(R,sum(S.dice))<ev(R,S.dice.length===2?D2:D1)-.3};
    case 'adjust':{let best=0,bv=-1e9;[-1,0,1].forEach(d=>{const tt=sum(S.dice)+d;if(tt<1||tt>12)return;const v=estOwn(R,tt)+(d===0?.01:0);if(v>bv){bv=v;best=d}});return {t:'adjust',d:best}}
    case 'choose':{
      if(S.pending[0]==='radio'){const tg=S.players.filter(p=>p!==R).reduce((a,b)=>b.coins>a.coins?b:a);return {t:'radio',pid:tg.id}}
      const o=swapOptions(R);if(!o.give.length||!o.take.length)return {t:'skip'};
      const tk=o.take.sort((a,b)=>CMAP[b.k].cost-CMAP[a.k].cost)[0];
      const gv=o.give.slice().sort((a,b)=>a.cost-b.cost)[0];
      if(CMAP[tk.k].cost<=gv.cost)return {t:'skip'};
      return {t:'swap',pid:tk.pid,take:tk.k,give:gv.k};
    }
    case 'buy':{
      const lms=lmsFor(S.mode).filter(l=>!R.lm[l.k]);
      const aff=lms.filter(l=>l.cost<=R.coins).sort((a,b)=>b.cost-a.cost);
      if(aff.length)return {t:'build',k:aff[0].k};
      const next=Math.min(...lms.map(l=>l.cost));
      if(next-R.coins<=2&&Math.random()<.6)return {t:'pass'};
      const opts=cardsFor(S.mode).filter(c=>S.bank[c.k]>0&&buyCost(R,c)<=R.coins&&!(c.c==='purple'&&own(R,c.k)))
        .map(c=>({c,s:cardValue(R,c)*(0.85+Math.random()*.3)})).sort((a,b)=>b.s-a.s);
      if(opts.length&&opts[0].s>.04)return {t:'buy',k:opts[0].c.k};
      return {t:'pass'};
    }
  }
  return null;
}
let cpuT=null;
function scheduleCPU(){
  clearTimeout(cpuT);
  if(!isHost||!S||S.phase==='lobby'||S.phase==='over')return;
  const R=cur();if(!R.cpu)return;
  const seenPhase=S.phase,seenTurn=S.turn;
  cpuT=setTimeout(()=>{
    if(S.phase!==seenPhase||S.turn!==seenTurn||!cur().cpu)return;
    const a=cpuDecide(cur());
    act(cur().id,a||{t:'pass'});
  },window.CPU_FAST?5:(seenPhase==='roll'?650:seenPhase==='buy'?900:700));
}

/* ===================== 通信(PeerJS) ===================== */
const PFX='yuyake-shotengai-v1-';
function genCode(){const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789';return Array.from({length:4},()=>A[Math.floor(Math.random()*A.length)]).join('')}
function publicState(){const pub=JSON.parse(JSON.stringify(S));pub.players.forEach(p=>delete p.cid);return pub}
function broadcast(){
  if(isHost&&peer){const pub=publicState();conns.forEach((v,conn)=>{try{if(conn.open)conn.send({t:'state',S:pub,you:v.pid})}catch(e){}})}
  render();scheduleCPU();
}
function send(a){if(isHost)act(me.pid,a);else if(hostConn&&hostConn.open)hostConn.send({t:'act',a})}
function setStatus(t){statusMsg=t;render()}

function hostRoom(online){
  isHost=true;me.pid=uid();
  S={phase:'lobby',mode:'normal',code:null,online,hostId:me.pid,players:[{id:me.pid,name:me.name,cpu:false,cid:me.cid}],log:[],bn:[]};
  if(online){
    if(!window.Peer){setStatus('通信の部品が読み込めませんでした。ネットにつながっているか確認してください');return}
    const start=()=>{
      const code=genCode();
      peer=new Peer(PFX+code);
      peer.on('open',()=>{S.code=code;statusMsg='';broadcast()});
      peer.on('error',err=>{if(err.type==='unavailable-id'){peer.destroy();start()}else setStatus('通信エラー：'+err.type)});
      peer.on('connection',conn=>{
        conn.on('data',d=>hostData(conn,d));
        conn.on('close',()=>hostClose(conn));
      });
      peer.on('disconnected',()=>{try{peer.reconnect()}catch(e){}});
    };
    start();
  }
  render();
}
function hostData(conn,d){
  if(!d)return;
  if(d.t==='join'){
    let p=S.players.find(x=>x.cid&&x.cid===d.cid);
    if(p){conns.set(conn,{pid:p.id});if(p.sub){p.cpu=false;p.sub=false;log(`${p.name}が戻ってきた！`)}}
    else if(S.phase==='lobby'){
      if(S.players.length>=4){conn.send({t:'full'});return}
      p={id:uid(),name:String(d.name||'ゲスト').slice(0,10),cpu:false,cid:d.cid};S.players.push(p);conns.set(conn,{pid:p.id});
    }else conns.set(conn,{pid:null});
    return broadcast();
  }
  if(d.t==='act'){const v=conns.get(conn);if(v&&v.pid)act(v.pid,d.a)}
}
function hostClose(conn){
  const v=conns.get(conn);conns.delete(conn);if(!v||!v.pid)return;
  const p=P(v.pid);if(!p)return;
  if(S.phase==='lobby')S.players=S.players.filter(x=>x!==p);
  else if(S.phase!=='over'){p.cpu=true;p.sub=true;log(`${p.name}の通信が切れたので、CPUが代わりに遊びます`)}
  broadcast();
}
function joinRoom(code){
  code=code.toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(code.length!==4){setStatus('部屋の合言葉は4文字です');return}
  if(!window.Peer){setStatus('通信の部品が読み込めませんでした');return}
  isHost=false;setStatus('つないでいます…');
  peer=new Peer();
  peer.on('open',()=>{
    hostConn=peer.connect(PFX+code,{reliable:true});
    hostConn.on('open',()=>hostConn.send({t:'join',name:me.name,cid:me.cid}));
    hostConn.on('data',d=>{
      if(d.t==='state'){S=d.S;me.pid=d.you;statusMsg='';render()}
      if(d.t==='full')setStatus('その部屋は満員です(4人まで)');
    });
    hostConn.on('close',()=>{setStatus('部屋主との通信が切れました。もう一度入り直してください')});
    setTimeout(()=>{if(!S)setStatus('まだつながりません。合言葉を確かめるか、少し待ってください')},9000);
  });
  peer.on('error',e=>setStatus(e.type==='peer-unavailable'?'その合言葉の部屋が見つかりません':'通信エラー：'+e.type));
}

  if(S.phase==='roll')return `<div class="prompt">あなたの番！ サイコロを何個振る？</div><div class="row"><button class="btn big" data-a='{"t":"roll","n":1}'>🎲 1個</button><button class="btn big" data-a='{"t":"roll","n":2}'>🎲🎲 2個</button></div>`;
  if(S.phase==='reroll')return `<div class="prompt">出た目は ${sum(S.dice)}。⛩️神社で振り直す？</div><div class="row"><button class="btn" data-a='{"t":"reroll","yes":false}'>このまま</button><button class="btn blue" data-a='{"t":"reroll","yes":true}'>振り直す</button></div>`;
  if(S.phase==='adjust'){const t=sum(S.dice);return `<div class="prompt">🚉駅前ロータリー：合計を変える？</div><div class="row">${[-1,0,1].filter(d=>t+d>=1&&t+d<=12).map(d=>`<button class="btn ${d?'blue':''}" data-a='${JSON.stringify({t:'adjust',d})}'>${t+d}${d===0?'(そのまま)':''}</button>`).join('')}</div>`}
  if(S.phase==='choose'){
    if(S.pending[0]==='radio')return `<div class="prompt">📻ラジオ局：だれから4枚もらう？</div><div class="choice">${S.players.filter(p=>p!==R).map(p=>`<button class="btn" data-a='${JSON.stringify({t:'radio',pid:p.id})}'>${esc(p.name)}(🪙${p.coins})</button>`).join('')}</div>`;
    const o=swapOptions(R);
    if(!o.give.length||!o.take.length)return `<div class="prompt">🏗️地上げ屋：取りかえられるお店がありません</div><button class="btn" data-a='{"t":"skip"}'>次へ</button>`;
    if(!ui.swapTake||!P(ui.swapTake.pid)||!own(P(ui.swapTake.pid),ui.swapTake.k))return `<div class="prompt">🏗️地上げ屋：もらうお店を選んでね</div><div class="choice">${o.take.map(t=>{const c=CMAP[t.k];return `<button class="btn ${c.c==='blue'?'blue':''}" data-ui="swaptake" data-pid="${t.pid}" data-k="${t.k}">${esc(P(t.pid).name)}の ${c.i}${c.n}</button>`}).join('')}</div><button class="btn gray" style="margin-top:6px" data-a='{"t":"skip"}'>使わない</button>`;
    const tc=CMAP[ui.swapTake.k];
    return `<div class="prompt">${tc.i}${tc.n}をもらうかわりに、わたすお店を選んでね</div><div class="choice">${o.give.map(c=>`<button class="btn" data-a='${JSON.stringify({t:'swap',pid:ui.swapTake.pid,take:ui.swapTake.k,give:c.k})}'>${c.i}${c.n}</button>`).join('')}</div><button class="btn gray" style="margin-top:6px" data-ui="swapback">選び直す</button>`;
  }
  if(S.phase==='buy')return `<div class="prompt">お店を1つ買うか、名所を建てよう(🪙${R.coins})</div><div class="small">光っているものが買えます</div><button class="btn gray" style="margin-top:6px" data-a='{"t":"pass"}'>買わずに終わる</button>`;
  return '';
}
function marketHTML(){
  const R=cur(),meP=S.players.find(p=>p.id===me.pid);
  const canBuy=S.phase==='buy'&&R.id===me.pid;
  const lmCards=lmsFor(S.mode).map(l=>{
    const done=meP&&meP.lm[l.k];const ok=canBuy&&!done&&R.coins>=l.cost;
    return `<button class="card lm ${ok?'can':''} ${done?'done':''}" ${ok?`data-a='${JSON.stringify({t:'build',k:l.k})}'`:'disabled'}><div class="ch"><span class="num">名所</span><span>🪙${l.cost}</span></div><div class="ci">${l.i}</div><div class="cn">${l.n}</div><div class="ce">${l.d}</div><div class="cs">${done?'✅ 建てた':''}</div></button>`}).join('');
  const groups=['blue','green','red','purple'].map(col=>{
    const cs=cardsFor(S.mode).filter(c=>c.c===col).sort((a,b)=>a.r[0]-b.r[0]);
    return `<div class="legend"><span>${COLOR_NAME[col]}</span></div><div class="mk" style="margin-bottom:10px">${cs.map(c=>{
      const cost=meP?buyCost(meP,c):c.cost;
      const ok=canBuy&&S.bank[c.k]>0&&R.coins>=cost&&!(c.c==='purple'&&own(R,c.k));
      return `<button class="card ${c.c} ${ok?'can':''}" ${ok?`data-a='${JSON.stringify({t:'buy',k:c.k})}'`:'disabled'}><div class="ch"><span class="num">${rs(c)}</span><span>🪙${cost}</span></div><div class="ci">${c.i}</div><div class="cn">${c.n}</div><div class="ce">${effText(c)}</div><div class="cs">${meP&&own(meP,c.k)?`持っている：${own(meP,c.k)}　`:''}のこり${S.bank[c.k]}</div></button>`}).join('')}</div>`}).join('');
  return `<div class="box"><h3>🏯 名所(${MODES[S.mode].need}つ建てたら勝ち)</h3><div class="mk">${lmCards}</div></div><div class="box"><h3>🏪 お店</h3>${groups}</div>`;
}
function gameHTML(){
  const dice=S.dice&&S.dice.length?S.dice.map(d=>`<div class="die">${d}</div>`).join('')+(S.total!=null?`<div class="total">＝ ${S.total}</div>`:`<div class="total">＝ ${sum(S.dice)}</div>`):'<div class="small">まだ振っていません</div>';
  return `<div class="row" style="justify-content:space-between"><div><h1 style="font-size:22px">🌇 ゆうやけ商店街</h1><div class="sub">${MODES[S.mode].name}モード・${S.round}周目${S.code?'・部屋 '+S.code:''}</div></div><button class="btn gray" style="padding:6px 10px;font-size:13px" data-ui="mute">${muted?'🔇':'🔊'}</button></div>
  <div style="margin-top:10px">${playersHTML()}</div>
  <div class="center"><div class="box"><div class="dice" id="dice">${dice}</div>${actionHTML()}</div>
  <div class="box"><h3>できごと</h3><div class="log">${S.log.slice(0,14).map(l=>`<div>${esc(l)}</div>`).join('')}</div></div></div>
  ${marketHTML()}<div class="status">${esc(statusMsg)}</div>${rulesHTML()}`;
}
let muted=lsGet('yy_mute','0')==='1';
function afterRender(){
  if(!S||S.phase==='lobby'){prevCoins={};return}
  // サイコロのころころ
  if(S.rollSeq!==lastRollSeq){
    const first=lastRollSeq===-1;lastRollSeq=S.rollSeq;
    if(!first&&S.dice&&S.dice.length){
      if(!muted)sfx.dice();
      const box=$('#dice'),dies=box?[...box.querySelectorAll('.die')]:[];let k=0;
      const finals=dies.map(d=>d.textContent);
      const tm=setInterval(()=>{dies.forEach(d=>d.textContent=rnd6());if(++k>6){clearInterval(tm);dies.forEach((d,i)=>d.textContent=finals[i])}},55);
    }
  }
  // コインの増減
  let up=false,down=false;
  S.players.forEach(p=>{
    const prev=prevCoins[p.id];
    if(prev!=null&&prev!==p.coins){
      const el=document.querySelector(`#pl-${p.id} .pc`);
      if(el){const f=document.createElement('span');const d=p.coins-prev;f.className='float '+(d>0?'plus':'minus');f.textContent=(d>0?'+':'')+d;el.appendChild(f)}
      if(p.id===me.pid){if(p.coins>prev)up=true;else down=true}
    }
    prevCoins[p.id]=p.coins;
  });
  if(!muted){if(up)sfx.coin();else if(down)sfx.lose()}
  // 大きな出来事
  if(S.gid!==lastGid){shownBn=firstState?Math.max(0,...(S.bn||[]).map(b=>b.id)):0;lastGid=S.gid;firstState=false;bnQ=[]}
  (S.bn||[]).forEach(b=>{if(b.id>shownBn){bnQ.push(b.t);shownBn=b.id}});
  pumpBanner();
}
function pumpBanner(){
  if(bnBusy||!bnQ.length)return;bnBusy=true;
  const el=$('#banner');el.innerHTML=bnQ.shift();el.classList.add('show');if(!muted)sfx.big();
  setTimeout(()=>{el.classList.remove('show');setTimeout(()=>{bnBusy=false;pumpBanner()},250)},1300);
}

document.addEventListener('click',e=>{
  const a=e.target.closest('[data-a]');
  if(a&&!a.disabled){try{AC&&AC.resume()}catch(_){};send(JSON.parse(a.dataset.a));if(JSON.parse(a.dataset.a).t==='swap'||JSON.parse(a.dataset.a).t==='skip')ui.swapTake=null;return}
  const u=e.target.closest('[data-ui]');if(!u)return;
  const k=u.dataset.ui;
  const saveName=()=>{const v=($('#nm')?.value||'').trim();if(!v){setStatus('なまえを入れてね');return false}me.name=v.slice(0,10);lsSet('yy_name',me.name);return true};
  if(k==='host'){if(saveName())hostRoom(true)}
  if(k==='solo'){if(saveName()){hostRoom(false);act(me.pid,{t:'addcpu'});act(me.pid,{t:'addcpu'})}}
  if(k==='join'){if(saveName())joinRoom($('#code').value)}
  if(k==='copy'){const v=$('#lk').value;(navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>setStatus('コピーしました！')).catch(()=>{$('#lk').select();setStatus('選ばれた文字をコピーしてね')})}
  if(k==='swaptake'){ui.swapTake={pid:u.dataset.pid,k:u.dataset.k};render()}
  if(k==='swapback'){ui.swapTake=null;render()}
  if(k==='mute'){muted=!muted;lsSet('yy_mute',muted?'1':'0');render()}
});
window.addEventListener('beforeunload',e=>{if(isHost&&S&&S.online&&S.phase!=='lobby'&&S.phase!=='over'){e.preventDefault();e.returnValue=''}});
render();
</script>
